name: ci

# One workflow, path-filtered per job: a job whose folder didn't change is *skipped*,
# and skipped jobs satisfy required status checks — so frontend-only PRs aren't blocked
# waiting for a backend check that never runs (and vice versa).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'contracts/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - 'contracts/**'
              - '.github/workflows/ci.yml'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build # tsc type-check + vite build

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: contracts/openapi.json is up to date
        run: |
          uv run python -m app.export_openapi
          git diff --exit-code ../contracts/openapi.json || {
            echo "::error::API changed but contracts/openapi.json was not regenerated. Run: cd backend && uv run python -m app.export_openapi"
            exit 1
          }
