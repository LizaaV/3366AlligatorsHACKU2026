# Run from the repo root:
#   docker compose -f deploy/docker-compose.yml up -d --build
name: earth-agent

services:
  backend:
    build:
      context: ../backend
    env_file:
      - path: ../backend/.env      # git-ignored; optional so the stack still boots on defaults (stub earth)
        required: false
    environment:
      EARTH_DATA_DIR: /data
      # Read by the backend for share links (#22); also the CORS origin below.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      # Overrides backend/.env. Same-origin through nginx, but allow the public URL anyway.
      CORS_ORIGINS: '["${PUBLIC_BASE_URL:-http://localhost}"]'
    volumes:
      - earth-data:/data
    networks: [web, earth-only]
    expose: ["8000"]               # internal only: not published on the host
    init: true                     # reap leftover sandbox child processes
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend         # the other team's folder: built, never edited
      dockerfile: ../deploy/frontend.Dockerfile
      additional_contexts:
        nginxconf: .               # = deploy/, provides nginx.conf
      args:
        VITE_API_SOURCE: ${VITE_API_SOURCE:-http}   # baked in at build time; fixture = mocks only
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"      # the single public entry point
    networks: [web]
    restart: unless-stopped

networks:
  web: {}
  # Reserved for the Docker sandbox (BUILD-PLAN M4 step 2): `earth-runner` containers will
  # join this network to reach the earth service and nothing else. internal = no internet, no host.
  earth-only:
    internal: true

volumes:
  earth-data:
