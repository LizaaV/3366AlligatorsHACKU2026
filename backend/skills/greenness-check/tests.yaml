# Test cases for the greenness-check skill.
# kind: preset  runs offline under EARTH_IMPL=stub (tests/test_skill_library.py); same format as
#               pond-filling-check/tests.yaml. The stub tells the Hoo Hok Wai story (ponds filled
#               since 2025: greenness falls, bare ground rises, inside ~5 C warmer than the ring).
# expect.findings / expect.observed: dotted path -> value or {lt|le|gt|ge|not: value}.
version: 1
skill: greenness-check
cases:
  - id: hoo_hok_wai_preset
    kind: preset
    note: "Filled ponds: far below the usual greenness for the month, surroundings as usual."
    earth_impl: stub
    area: HOO_HOK_WAI
    params: {}
    expect:
      ok: true
      findings:
        verdict: less green than usual
        surroundings.verdict: as green as usual
        greenness.gap: {lt: -0.2}
        unusual_since: {not: null}
      observed:
        greenness.inside_band: false
        greenness.local: true
        greenness.persistent: true
        greenness.delta: {lt: -0.2}
      blocks: [then_now, timeline, stat]
      primary: then_now

  - id: tiny_area_limits
    kind: preset
    note: "A 15 m circle is under the 10 m pixel floor: one limits block."
    earth_impl: stub
    area: {lat: 22.534, lon: 114.09, radius_m: 15}
    params: {}
    expect:
      ok: true
      findings:
        limited: true
        reason: area_too_small
      blocks: [limits]
