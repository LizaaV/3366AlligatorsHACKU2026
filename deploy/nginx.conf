server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS: re-resolve "backend" so a recreated backend container
    # (new IP) keeps working without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API (incl. the SSE run stream: POST /api/runs)
    location /api/ {
        # A variable in proxy_pass forces runtime DNS. With no URI part, the original
        # request URI (/api/...) is passed to the backend unchanged.
        set $backend http://backend:8000;
        proxy_pass $backend;
        client_max_body_size 10m;   # let the API answer oversized bodies, not nginx's HTML 413
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-sent events: never buffer or cache, allow long-lived responses.
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Hashed build assets
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Never cache the entry point: a stale index.html after a redeploy points at
    # deleted hashed assets and gives a blank page.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA history fallback (served as index.html, so also no-cache)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
