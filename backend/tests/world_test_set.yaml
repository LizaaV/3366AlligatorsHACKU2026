# World test set (docs/BUILD-PLAN.md section 8.2): eight places nobody tuned for.
#
# Each entry has a plain question, a documented real-world event with a public source, a nearby
# control that should NOT change, the Sentinel-2 windows to compare, and the scene ids seen in the
# Earth Search STAC catalogue (sentinel-2-l2a) when this file was written (Sat 3 Oct 2026).
#
# Pass criterion (BUILD-PLAN 8.2): a sensible DIRECTION of change, honest confidence and a correct
# "can't tell" -- NOT exact numbers. So `expected.direction` only holds up / down / flat per measure.
#
# How it is used (tests/test_world.py):
#   * normal `pytest`            -> only validates this file's schema (CI-safe, no network).
#   * `pytest -m world`          -> runs real `earth.compare(...)` per measure (needs EARTH_IMPL=real,
#                                   network, and `backend/earth/`).
#
# Field notes:
#   area / control   {lat, lon, radius_m} (a circle) or {geojson}. Area is <= 25 km2 and >= 2 ha,
#                    except urban_small (< 1 ha on purpose).
#   windows          [start, end] ISO dates, before < after. The compare dates are taken from the first
#                    scene id (date inside the id) of scenes_seen.before / scenes_seen.after.
#   scenes_seen      Earth Search ids with tile-level eo:cloud_cover < 30 (flood row: < 60, winter
#                    Albania is cloudy on purpose: the radar-fallback case). Cloud over the AREA is
#                    computed by earth later.
#   expected         direction: measure -> up | down | flat (sign of delta = after - before).
#                    changed: should the answer say "something changed" in this area?
#                    measure_only_ok: a measure-only answer ("greenness fell 40%, cause unknown") passes.
#                    control_tolerance: max |delta| allowed on the control (default 0.1 index units).
#                    error: an EarthError class name the call must raise (urban_small).
#
# Values below that were measured by the author with a throw-away NDVI/NDWI script on the scenes in
# scenes_seen are summarised in `expected.notes` so a failing test can be sanity-checked.

- id: w1-merauke-clearing
  kind: vegetation_loss
  name: Merauke food estate clearing (Wanam area), South Papua
  question: Has the forest here been cleared in the last two years?
  area: {lat: -7.4875, lon: 139.1125, radius_m: 1000}   # ~3.1 km2, S hemisphere
  event:
    range: [2024-01-01, 2025-06-30]
    what: >-
      Merauke National Strategic Project (sugarcane/rice food estate): 22,272 ha of natural ecosystem
      cleared Jan 2024 - Jun 2025, 9,835 ha of it primary forest; excavators concentrated around the
      villages Wanam and Wogikel. Exact cleared pixels were located by scanning Sentinel-2, not taken
      from a source polygon.
  expected:
    direction: {greenness: down, moisture: down}
    changed: true
    measure_only_ok: true
    notes: >-
      Measured NDVI 0.77 (2023-07-19) -> 0.53 (2025-06-13), NDMI 0.39 -> 0.08. Tropical cloud: only
      3 scenes under 40% tile cloud in 2025 May-Oct, so the radar (roughness) fallback must be offered.
  control: {lat: -7.5, lon: 138.98, radius_m: 1000}      # intact forest; NDVI 0.73 -> 0.76
  must_exercise: [cloud_to_radar_fallback]
  windows:
    before: [2023-06-01, 2023-09-30]
    after: [2025-05-01, 2025-09-30]
  scenes_seen:
    before: [S2B_54MTS_20230719_0_L2A, S2B_54MTS_20230629_0_L2A]
    after: [S2C_54MTS_20250613_0_L2A, S2A_54MTS_20250516_0_L2A]
  sources:
    - https://news.mongabay.com/2024/12/indonesia-risks-carbon-backfire-with-massive-deforestation-for-sugarcane/
    - https://nusantara-atlas.org/farming-the-unfarmable-the-high-stakes-gamble-in-papuas-wetlands/
    - https://nominatim.openstreetmap.org/search?q=Wanam,Merauke&format=json

- id: w2-elephant-butte-drawdown
  kind: water_loss
  name: Elephant Butte Reservoir (north-east arm near the MGRS 13SBS/13SCS edge), New Mexico
  question: Has the water here dried up since 2023?
  area: {lat: 33.27, lon: -107.15, radius_m: 1200}       # ~4.5 km2, N hemisphere
  event:
    date: 2026-07-27
    what: >-
      Elephant Butte Reservoir fell to 1.4% of capacity on 2026-07-27, its lowest level since 1971
      (drought and a poor Colorado/Rio Grande snow year).
  expected:
    direction: {water: down, greenness: up}
    changed: true
    measure_only_ok: false
    notes: >-
      Measured at (33.27,-107.15) r=300 m: NDWI +0.51 (2023-07-27) -> -0.50 (2026-08-10); NDVI -0.31 ->
      +0.49 (plants colonise the exposed lake bed). Area straddles the MGRS 13SBS / 13SCS edge (UTM 13N
      easting 300000 m): 13SBS covers all of it, 13SCS about 40% of it, on the same dates.
  control: {lat: 33.10, lon: -107.05, radius_m: 1000}    # desert upland, NDWI -0.29 -> -0.28
  must_exercise: [water, mgrs_tile_edge]
  windows:
    before: [2023-06-01, 2023-08-31]
    after: [2026-07-01, 2026-09-15]
  scenes_seen:
    before: [S2A_13SBS_20230727_0_L2A, S2A_13SBS_20230806_0_L2A, S2A_13SCS_20230720_0_L2A]
    after: [S2C_13SBS_20260810_0_L2A, S2C_13SBS_20260731_0_L2A, S2C_13SCS_20260810_0_L2A]
  sources:
    - https://www.western-water.com/2026/08/21/still-at-1-4-elephant-butte-at-lowest-level-since-1971/
    - https://science.nasa.gov/earth/earth-observatory/elephant-butte-reservoir-runs-low/
    - https://nominatim.openstreetmap.org/search?q=Elephant+Butte+Dam&format=json

- id: w3-albania-flood
  kind: flood
  name: Myzeqe plain near Divjaka and Fier, Albania (January 2026 floods)
  question: Was this land under water in January 2026?
  area: {lat: 40.8234, lon: 19.4547, radius_m: 1000}     # ~3.1 km2, N hemisphere
  event:
    range: [2026-01-05, 2026-01-15]
    what: >-
      Prolonged heavy rain in early January 2026 flooded low-lying land in central and western Albania
      (Fier and Berat named); Copernicus EMS activated EMSR856 on 2026-01-09, flood delineation as of
      2026-01-10. The exact point was chosen by scanning Sentinel-2 for a large NDWI rise, it is NOT a
      CEMS polygon: treat the exact location as less certain than the event.
  expected:
    direction: {water: up, greenness: down}
    changed: true
    measure_only_ok: true
    control_tolerance: 0.3
    notes: >-
      Measured NDWI -0.48 (2025-12-08) -> -0.04 (2026-01-15, 91% clean), NDVI 0.48 -> 0.08. Tile cloud
      is 45-47% on both January scenes, so radar (roughness down over open water) should be offered.
      Whole region was wetter in January (control NDWI -0.62 -> -0.43), hence the wide control tolerance.
  control: {lat: 40.80, lon: 19.62, radius_m: 1000}
  must_exercise: [before_after, radar]
  windows:
    before: [2025-12-01, 2025-12-31]
    after: [2026-01-10, 2026-01-31]
  scenes_seen:
    before: [S2A_34TCL_20251208_0_L2A, S2C_34TCL_20251226_0_L2A]
    after: [S2C_34TCL_20260115_0_L2A, S2B_34TCL_20260130_0_L2A]
  sources:
    - https://eu-space.europa.eu/components/earth-observation-copernicus/image-of-day/floods-albania
    - https://nominatim.openstreetmap.org/search?q=Fier,Albania&format=json

- id: w4-longwood-fire
  kind: burn_scar
  name: Longwood bushfire near Ruffy, Victoria
  question: Did a fire burn here this summer?
  area: {lat: -36.946, lon: 145.497, radius_m: 2500}     # ~19.6 km2, S hemisphere
  event:
    range: [2026-01-07, 2026-01-21]
    what: >-
      Longwood bushfire started 2026-01-07 (Hume Highway), more than 136,000 ha burned by 2026-01-12,
      contained 2026-01-21; Ruffy is among the surveyed burned localities. Copernicus Sentinel-2 image of
      2026-01-09 shows the burn scars south of Longwood.
  expected:
    direction: {greenness: down, moisture: down}
    changed: true
    measure_only_ok: true
    notes: >-
      Measured NDVI 0.49 -> 0.25, NDMI 0.01 -> -0.34, NBR 0.25 -> -0.30 (2025-12-17 vs 2026-01-24).
      Only ~20 km2 of a 1,360 km2 footprint is sampled; this exercises the large-area budget path only
      partly (full footprint should be refused or downsampled, not crash).
  control: {lat: -36.90, lon: 145.30, radius_m: 2500}    # unburned farmland, NBR 0.025 -> 0.021
  must_exercise: [burn, large_area_budget]
  windows:
    before: [2025-12-10, 2026-01-06]
    after: [2026-01-22, 2026-02-28]
  scenes_seen:
    before: [S2B_55HCV_20251217_1_L2A, S2A_55HCV_20251227_1_L2A]
    after: [S2C_55HCV_20260124_0_L2A, S2C_55HCV_20260220_0_L2A]
  sources:
    - https://riskfrontiers.com/insights/victorian-bushfires-2026-longwood-fire-post-event-field-survey/
    - https://eu-space.europa.eu/components/earth-observation-copernicus/image-of-day/bushfires-state-victoria-australia
    - https://nominatim.openstreetmap.org/search?q=Ruffy,Victoria&format=json

- id: w5-navi-mumbai-airport
  kind: construction
  name: Navi Mumbai International Airport site, Maharashtra
  question: Has this site been built up since 2018?
  area: {lat: 18.9913, lon: 73.0657, radius_m: 1000}     # ~3.1 km2, N hemisphere
  event:
    date: 2025-10-08
    what: >-
      Airport inaugurated 2025-10-08, commercial operations from 2025-12-25; construction began in
      2021 (a gradual change over years, runway and terminal on formerly vegetated hills).
  expected:
    direction: {bare: up, greenness: down}
    changed: true
    measure_only_ok: true
    notes: >-
      Weak, gradual signal: NDVI 0.30 (2018-01-03) -> 0.08 (2026-02-25), NDBI 0.01 -> 0.09. Before window is
      pre-2023 because the site was already largely graded by 2021 (NDVI 0.12). Pre-2022-01-25 scenes carry
      no BOA offset: M1 must handle both sides.
  control: {lat: 19.02, lon: 73.15, radius_m: 1000}      # NDVI 0.35 -> 0.30 (different tile 43QCB)
  must_exercise: [bare, gradual_change, pre_2022_offset]
  windows:
    before: [2018-01-01, 2018-04-30]
    after: [2026-01-01, 2026-03-31]
  scenes_seen:
    before: [S2B_43QBB_20180103_3_L2A, S2B_43QBB_20180304_2_L2A]
    after: [S2C_43QBB_20260225_0_L2A, S2C_43QBB_20260116_0_L2A]
  sources:
    - https://en.wikipedia.org/wiki/Navi_Mumbai_International_Airport
    - https://indianinfrastructure.com/2025/10/09/navi-mumbai-international-airport-in-maharashtra-witnesses-inauguration/
    - https://nominatim.openstreetmap.org/search?q=Navi+Mumbai+International+Airport&format=json

- id: w6-cyprus-mesaoria-fields
  kind: cropland
  name: Farmland on the Mesaoria plain east of Dali, Cyprus
  question: Is this field greener than it was last spring?
  area: {lat: 35.10, lon: 33.50, radius_m: 800}          # ~2.0 km2, N hemisphere
  event:
    range: [2025-03-12, 2026-03-11]
    what: >-
      NASA imagery comparison (12 Mar 2025, 23 Aug 2025, 11 Mar 2026) shows Cyprus much greener in March 2026
      after heavy rain than a year earlier. Source speaks about the island, not this field; that this
      point is cropland is NOT verified (no land-cover lookup done).
  expected:
    direction: {greenness: up, moisture: up}
    changed: true
    measure_only_ok: true
    notes: >-
      Measured NDVI 0.46 (2025-03-15) -> 0.74 (2026-03-08). Same-season comparison: a good answer says
      "greener than last March", reports no cause beyond the measure, and does not call it a trend from
      two dates.
  control: {lat: 35.15, lon: 33.40, radius_m: 800}       # NDVI 0.23 -> 0.28 (sparse land, same tile)
  must_exercise: [seasonal_band, measure_only]
  windows:
    before: [2025-03-01, 2025-03-31]
    after: [2026-03-01, 2026-03-31]
  scenes_seen:
    before: [S2A_36SWD_20250315_1_L2A, S2B_36SWD_20250308_0_L2A]
    after: [S2C_36SWD_20260308_0_L2A, S2B_36SWD_20260303_0_L2A]
  sources:
    - https://cyprus-mail.com/2026/03/30/satellite-images-show-how-rainfall-turned-cyprus-green
    - https://nominatim.openstreetmap.org/search?q=Dali,Cyprus&format=json

- id: w7-paley-park
  kind: urban_small
  name: Paley Park, Manhattan
  question: Did the greenery in this little park change?
  area: {lat: 40.7603441, lon: -73.9750747, radius_m: 12}   # ~0.045 ha, N hemisphere
  event:
    what: >-
      No event: a vest-pocket park (OSM bounding box about 32 m x 25 m). The point is that a Sentinel-2
      pixel is 10 m, so a few pixels cannot support a measurement.
  expected:
    direction: {}
    changed: false
    measure_only_ok: false
    error: AreaTooSmall
    notes: >-
      Earth must refuse honestly (AreaTooSmall with a hint to draw a bigger area), never invent a number.
      Reference (not for assertion): NDVI 0.26 (2025-06-03) vs 0.32 (2026-06-03) over 12 m radius, 1-4 pixels.
  control: {lat: 40.7537509, lon: -73.9835428, radius_m: 100}   # Bryant Park, ~3 ha
  must_exercise: [AreaTooSmall]
  windows:
    before: [2025-06-01, 2025-07-31]
    after: [2026-06-01, 2026-07-31]
  scenes_seen:
    before: [S2C_18TWL_20250603_0_L2A, S2B_18TWL_20250725_0_L2A]
    after: [S2B_18TWL_20260603_0_L2A, S2C_18TWL_20260725_0_L2A]
  sources:
    - https://nominatim.openstreetmap.org/search?q=Paley+Park,New+York&format=json
    - https://en.wikipedia.org/wiki/Paley_Park

- id: w8-namib-stable
  kind: control
  name: Namib Sand Sea gravel and dune plain near Sossusvlei, Namibia
  question: Has anything changed here this year?
  area: {lat: -24.80, lon: 15.40, radius_m: 1500}        # ~7.1 km2, S hemisphere
  event:
    what: >-
      No documented event (hyper-arid desert chosen as a stable control; no source claims change).
      Place name verified with Nominatim (Sossusvlei -24.74, 15.29).
  expected:
    direction: {greenness: flat, water: flat, bare: flat, moisture: flat}
    changed: false
    measure_only_ok: true
    notes: >-
      Measured NDVI 0.109 (2025-04-20) -> 0.104 (2026-03-21), NDMI -0.12 -> -0.13. Must say "no unusual
      change" and not over-read a 0.005 wobble.
  control: {lat: -24.75, lon: 15.60, radius_m: 1500}     # ~20 km east, NDVI 0.114 -> 0.110
  must_exercise: [no_change_honesty]
  windows:
    before: [2025-03-01, 2025-04-30]
    after: [2026-03-01, 2026-04-30]
  scenes_seen:
    before: [S2A_33JWN_20250420_1_L2A, S2B_33JWN_20250331_0_L2A]
    after: [S2C_33JWN_20260321_0_L2A, S2C_33JWN_20260423_0_L2A]
  sources:
    - https://nominatim.openstreetmap.org/search?q=Sossusvlei&format=json
