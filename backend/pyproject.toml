[project]
name = "earth-agent-backend"
version = "0.1.0"
description = "Earth Agent API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "pystac-client>=0.9.0",
  "odc-stac>=0.5.3",
  "rasterio>=1.5.2",
  "planetary-computer>=1.0.0",
  "numpy>=2.5.3",
  "pillow>=12.3.0",
  "shapely>=2.1.2",
  "pyproj>=3.8.0",
  "anthropic>=1.11.0",
  "pyyaml>=6.0.3",
  "sse-starlette>=3.5.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
